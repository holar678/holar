<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>行囊勇者 · 原型</title>
<style>
:root{--bg:#1b1d2a;--panel:#262a3d;--cell:#333850;--lock:#20222f;--line:#454b6b;--txt:#eceefb;--dim:#9aa0c3;--gold:#ffcf4a;--red:#ff6b6b;--green:#5fd38d;--blue:#6aa8ff;--acc:#8b7bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none}
#app{max-width:420px;margin:0 auto;padding:10px 12px 24px;min-height:100vh}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.bar b{font-size:15px}.gold{color:var(--gold)}.dim{color:var(--dim);font-size:12px}
.panel{background:var(--panel);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.enemy{display:flex;align-items:center;gap:10px}
.enemy .ico{font-size:34px;width:44px;text-align:center}
.hp{height:12px;background:#15161f;border-radius:6px;overflow:hidden;margin-top:3px;position:relative}
.hp i{display:block;height:100%;background:var(--red);transition:width .1s}
.hp.me i{background:var(--green)}
.hp span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:12px}
#grid{position:relative;margin:0 auto 8px;display:grid;gap:3px}
.c{background:var(--cell);border-radius:6px}
.c.lock{background:var(--lock);border:1px dashed var(--line)}
.c.buy{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px}
.it{position:absolute;pointer-events:none;border-radius:8px;background:#4a5180;border:2px solid #7a83c4;display:flex;align-items:center;justify-content:center;overflow:hidden}
.it.l2{border-color:var(--blue);background:#35527f}.it.l3{border-color:var(--gold);background:#6b5a2a}
.it em{font-style:normal;position:relative;z-index:1}
.it small{position:absolute;right:3px;bottom:1px;font-size:10px;z-index:1}
.it .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.22);height:0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{font:inherit;color:var(--txt);background:#3b4165;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}
button.pri{background:var(--acc);font-weight:600}
button.ad{background:#2f6b4b}
button:disabled{opacity:.4}
.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.card{background:#30355a;border-radius:8px;padding:6px 2px;text-align:center;min-height:74px;cursor:pointer}
.card.sold{opacity:.25}
.card .e{font-size:24px}.card .n{font-size:11px}.card .p{font-size:11px;color:var(--gold)}
#toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#mask{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:8;padding:16px}
#mask .box{background:var(--panel);border-radius:12px;padding:16px;max-width:360px;width:100%;text-align:center}
.relic{display:block;width:100%;text-align:left;margin:6px 0;background:#30355a}
#log{height:38px;overflow:hidden;font-size:12px;color:var(--dim)}
h3{margin:0 0 8px}
</style>
</head>
<body>
<div id="app">
  <div class="bar"><b id="tRound"></b><span id="tHeart"></span><b class="gold" id="tGold"></b></div>
  <div class="dim" id="tRelics" style="margin-bottom:6px"></div>
  <div class="panel enemy"><div class="ico" id="eIco"></div><div style="flex:1">
    <div><b id="eName"></b> <span class="dim" id="eInfo"></span></div>
    <div class="hp"><i id="eBar"></i><span id="eTxt"></span></div></div></div>
  <div class="panel"><div class="dim">我方生命</div><div class="hp me"><i id="pBar"></i><span id="pTxt"></span></div></div>
  <div id="grid"></div>
  <div id="shopUI">
    <div class="panel" id="hand"></div>
    <div class="shop" id="shop"></div>
    <div class="row" style="margin-bottom:8px">
      <button id="bRef"></button><button class="ad" id="bRefAd">▶ 看广告免费刷新</button>
    </div>
    <button class="pri" id="bGo" style="width:100%;padding:12px">开始战斗</button>
    <p class="dim">玩法:点商店物品买入 → 点格子放下;点已放物品可拿起。同名同级物品叠放即合成升级。点虚线格可花 2 金币扩容。磨刀石、沙漏只对相邻物品生效。</p>
  </div>
  <div id="battleUI" style="display:none"><div class="panel"><div id="log"></div></div></div>
</div>
<div id="toast"></div>
<div id="mask"><div class="box" id="box"></div></div>
<script>
// ---------- 数据 ----------
const COLS=6,ROWS=5,LV=[1,2.2,5],MAXR=10;
const ITEMS={
 dagger:{n:'匕首',e:'🔪',w:1,h:1,cost:2,t:'weapon',v:2,cd:0.9},
 sword:{n:'长剑',e:'🗡️',w:1,h:2,cost:3,t:'weapon',v:4,cd:1.6},
 bow:{n:'猎弓',e:'🏹',w:1,h:3,cost:5,t:'weapon',v:7,cd:2.0},
 hammer:{n:'战锤',e:'🔨',w:2,h:2,cost:6,t:'weapon',v:14,cd:3.0},
 shield:{n:'盾牌',e:'🛡️',w:1,h:2,cost:4,t:'shield',v:5,cd:2.5},
 apple:{n:'苹果',e:'🍎',w:1,h:1,cost:2,t:'heal',v:2,cd:2.0},
 vial:{n:'毒瓶',e:'🧪',w:1,h:1,cost:4,t:'poison',v:1,cd:2.0},
 stone:{n:'磨刀石',e:'🪨',w:1,h:1,cost:3,t:'bdmg',v:0.25},
 glass:{n:'沙漏',e:'⏳',w:1,h:1,cost:4,t:'bcd',v:0.12},
 charm:{n:'护符',e:'📿',w:1,h:1,cost:3,t:'hp',v:8},
};
const DESC={weapon:(v,cd)=>`每 ${cd}s 造成 ${v} 伤害`,shield:(v,cd)=>`每 ${cd}s 获得 ${v} 护盾`,heal:(v,cd)=>`每 ${cd}s 回复 ${v} 生命`,
 poison:(v,cd)=>`每 ${cd}s 叠 ${v} 层毒(每层每秒 1 伤害)`,bdmg:v=>`相邻武器伤害 +${Math.round(v*100)}%`,bcd:v=>`相邻物品冷却 -${Math.round(v*100)}%`,hp:v=>`生命上限 +${v}`};
const ENEMIES=[
 {n:'史莱姆',e:'🟢',hp:60,atk:3,cd:1.8},{n:'蝙蝠',e:'🦇',hp:110,atk:2,cd:0.8},{n:'骷髅兵',e:'💀',hp:170,atk:7,cd:2.0},
 {n:'野狼',e:'🐺',hp:240,atk:5,cd:1.1},{n:'石像',e:'🗿',hp:300,atk:12,cd:2.4,armor:6,tip:'每次攻击获得 6 护盾'},
 {n:'女巫',e:'🧙',hp:420,atk:5,cd:1.4,poison:1,tip:'攻击附带中毒'},{n:'食人魔',e:'👹',hp:540,atk:17,cd:2.8},
 {n:'幽灵',e:'👻',hp:680,atk:7,cd:1.0},{n:'幼龙',e:'🐉',hp:850,atk:14,cd:1.7},
 {n:'魔王',e:'😈',hp:1300,atk:16,cd:1.6,regen:5,tip:'每秒回复 5 生命'}];
const RELICS=[
 {k:'haste',n:'⚡ 狂热',d:'所有物品冷却 -12%'},{k:'tough',n:'❤️ 厚皮',d:'生命上限 +15'},{k:'rich',n:'💰 商人',d:'每回合额外 +3 金币'},
 {k:'sharp',n:'🔺 利刃',d:'武器伤害 +20%'},{k:'guard',n:'🧱 先手',d:'开战自带 12 护盾'},{k:'venom',n:'☠️ 剧毒',d:'毒瓶每次多叠 1 层'},
 {k:'leech',n:'🩸 吸血',d:'武器伤害的 10% 回复生命'},{k:'space',n:'🎒 扩容',d:'立即免费解锁 3 格'},{k:'crit',n:'🎯 暴击',d:'武器 15% 几率双倍伤害'},{k:'regen',n:'🌿 再生',d:'每秒回复 1 生命'}];

// ---------- 广告接口(原型为模拟;上线时换成 wx.createRewardedVideoAd) ----------
function showRewardedAd(onReward){
  let s=2; openBox(`<h3>模拟激励视频</h3><p id="adT">广告播放中… ${s}</p>`);
  const t=setInterval(()=>{s--; if(s<=0){clearInterval(t);closeBox();onReward();} else $('adT').textContent=`广告播放中… ${s}`;},700);
}

// ---------- 状态 ----------
let S; const $=id=>document.getElementById(id); let uid=1;
function newGame(){
  S={round:1,hearts:3,gold:10,items:[],hand:null,shop:[],relics:{},unlocked:new Set(),revived:false,phase:'shop'};
  for(let y=1;y<4;y++)for(let x=1;x<5;x++)S.unlocked.add(x+','+y);
  rollShop(); render();
}
const rel=k=>S.relics[k]||0;
const dim=it=>{const d=ITEMS[it.id];return it.rot?{w:d.h,h:d.w}:{w:d.w,h:d.h}};
function cellsOf(it,x=it.x,y=it.y){const {w,h}=dim(it),a=[];for(let j=0;j<h;j++)for(let i=0;i<w;i++)a.push((x+i)+','+(y+j));return a}
function itemAt(x,y){return S.items.find(it=>cellsOf(it).includes(x+','+y))}
function canPlace(it,x,y){return cellsOf(it,x,y).every(c=>S.unlocked.has(c)&&!S.items.some(o=>cellsOf(o).includes(c)))}
function rollShop(){const ks=Object.keys(ITEMS);S.shop=[0,1,2,3].map(()=>({id:ks[Math.random()*ks.length|0],sold:false}))}
const refCost=()=>1;
const sellVal=it=>Math.max(1,Math.floor(ITEMS[it.id].cost*Math.pow(2,it.lvl-1)/2));
const maxHp=()=>40+4*(S.round-1)+15*rel('tough')+S.items.reduce((s,it)=>s+(ITEMS[it.id].t==='hp'?Math.round(ITEMS[it.id].v*LV[it.lvl-1]):0),0);
function neighbors(it){const mine=cellsOf(it),set=new Set();
  for(const c of mine){const [x,y]=c.split(',').map(Number);for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const o=itemAt(x+dx,y+dy);if(o&&o!==it)set.add(o)}}
  return [...set]}
function statOf(it){const d=ITEMS[it.id],m=LV[it.lvl-1];let v=d.v*m,cd=d.cd;
  if(d.cd){let f=1-0.12*rel('haste');for(const o of neighbors(it)){const od=ITEMS[o.id];
      if(od.t==='bcd')f-=od.v*o.lvl; if(od.t==='bdmg'&&d.t==='weapon')v*=1+od.v*o.lvl;}
    cd=+(d.cd*Math.max(0.4,f)).toFixed(2);}
  if(d.t==='weapon')v*=1+0.2*rel('sharp'); if(d.t==='poison')v=Math.round(v)+rel('venom');
  if(d.t==='bdmg'||d.t==='bcd')v=d.v*it.lvl;
  return {v:d.t==='bdmg'||d.t==='bcd'?v:Math.round(v*10)/10,cd}}
function descOf(it){const d=ITEMS[it.id],s=statOf(it);return DESC[d.t](s.v,s.cd)}

// ---------- 渲染 ----------
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1200)}
function openBox(html){$('box').innerHTML=html;$('mask').style.display='flex'}
function closeBox(){$('mask').style.display='none'}
function cellSize(){return Math.min(58,Math.floor((Math.min(420,innerWidth)-24-3*(COLS-1))/COLS))}
function render(){
  const en=ENEMIES[S.round-1];
  $('tRound').textContent=`第 ${S.round}/${MAXR} 关`;$('tHeart').textContent='❤️'.repeat(S.hearts)+'🖤'.repeat(Math.max(0,3-S.hearts));
  $('tGold').textContent=`🪙 ${S.gold}`;
  $('tRelics').textContent=Object.keys(S.relics).length?'遗物:'+RELICS.filter(r=>rel(r.k)).map(r=>r.n+(rel(r.k)>1?'×'+rel(r.k):'')).join('  '):'遗物:暂无(第 2/4/6/8 关胜利后三选一)';
  if(S.phase==='shop'){$('eIco').textContent=en.e;$('eName').textContent=en.n;
    $('eInfo').textContent=`攻击 ${en.atk} / ${en.cd}s${en.tip?' · '+en.tip:''}`;setBar('e',en.hp,en.hp);const m=maxHp();setBar('p',m,m);}
  const cs=cellSize(),g=$('grid');g.style.gridTemplateColumns=`repeat(${COLS},${cs}px)`;g.style.width=(cs*COLS+3*(COLS-1))+'px';g.innerHTML='';
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const c=document.createElement('div'),k=x+','+y;c.className='c';c.style.height=cs+'px';
    if(!S.unlocked.has(k)){c.classList.add('lock');if(canUnlock(x,y)&&S.phase==='shop'){c.classList.add('buy');c.textContent='+2🪙'}}
    c.onclick=()=>tapCell(x,y);g.appendChild(c)}
  for(const it of S.items){const {w,h}=dim(it),e=document.createElement('div');e.className='it l'+it.lvl;e.id='it'+it.uid;
    e.style.cssText=`left:${it.x*(cs+3)}px;top:${it.y*(cs+3)}px;width:${w*cs+(w-1)*3}px;height:${h*cs+(h-1)*3}px;font-size:${cs*0.55}px`;
    e.innerHTML=`<div class="cd"></div><em>${ITEMS[it.id].e}</em><small>Lv${it.lvl}</small>`;g.appendChild(e)}
  $('shopUI').style.display=S.phase==='shop'?'':'none';$('battleUI').style.display=S.phase==='battle'?'':'none';
  if(S.phase!=='shop')return;
  const hd=$('hand');
  if(S.hand){const d=ITEMS[S.hand.id],dm=dim(S.hand);hd.innerHTML=`<div><b>手中:${d.e} ${d.n} Lv${S.hand.lvl}</b> <span class="dim">占 ${dm.w}×${dm.h} 格 · ${DESC[d.t](Math.round(d.v*(d.t==='bdmg'||d.t==='bcd'?S.hand.lvl:LV[S.hand.lvl-1])*100)/100,d.cd)}</span></div>
    <div class="row" style="margin-top:6px"><button id="bRot">↻ 旋转</button><button id="bSell">出售 +${sellVal(S.hand)}🪙</button><span class="dim">点格子放下(以左上角为准)</span></div>`;
    $('bRot').onclick=()=>{S.hand.rot=!S.hand.rot;render()};$('bSell').onclick=()=>{S.gold+=sellVal(S.hand);S.hand=null;render()};
  }else hd.innerHTML='<span class="dim">手中为空。点商店物品购买,或点背包里的物品拿起。</span>';
  const sh=$('shop');sh.innerHTML='';
  S.shop.forEach((s,i)=>{const d=ITEMS[s.id],c=document.createElement('div');c.className='card'+(s.sold?' sold':'');
    c.innerHTML=`<div class="e">${d.e}</div><div class="n">${d.n} ${d.w}×${d.h}</div><div class="p">🪙${d.cost}</div>`;c.onclick=()=>buy(i);sh.appendChild(c)});
  $('bRef').textContent=`刷新商店 -${refCost()}🪙`;
}
function setBar(p,v,m,blk){$(p+'Bar').style.width=Math.max(0,v/m*100)+'%';$(p+'Txt').textContent=`${Math.max(0,Math.ceil(v))}/${m}`+(blk>0?`  🛡${Math.ceil(blk)}`:'')}
function canUnlock(x,y){return !S.unlocked.has(x+','+y)&&[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>S.unlocked.has((x+a)+','+(y+b)))}

// ---------- 整备阶段操作 ----------
function buy(i){const s=S.shop[i],d=ITEMS[s.id];if(s.sold)return;if(S.hand)return toast('先放下或卖掉手里的物品');
  if(S.gold<d.cost)return toast('金币不足');S.gold-=d.cost;s.sold=true;S.hand={uid:uid++,id:s.id,lvl:1,rot:false};render()}
function tapCell(x,y){if(S.phase!=='shop')return;const k=x+','+y;
  if(!S.unlocked.has(k)){if(!canUnlock(x,y))return;if(S.gold<2)return toast('金币不足');S.gold-=2;S.unlocked.add(k);return render()}
  const at=itemAt(x,y);
  if(S.hand){
    if(at&&at.id===S.hand.id&&at.lvl===S.hand.lvl){if(at.lvl>=3)return toast('已是最高级');at.lvl++;S.hand=null;toast('合成升级!');return render()}
    if(!canPlace(S.hand,x,y))return toast('放不下,试试旋转或换位置');
    S.hand.x=x;S.hand.y=y;S.items.push(S.hand);S.hand=null;return render()}
  if(at){S.items=S.items.filter(o=>o!==at);S.hand=at;render();
    const d=ITEMS[at.id];if(d.cd||d.t==='bdmg'||d.t==='bcd')toast(d.n+':'+DESC[d.t](Math.round(d.v*(d.cd?LV[at.lvl-1]:at.lvl)*100)/100,d.cd))}
}
$('bRef').onclick=()=>{if(S.gold<refCost())return toast('金币不足');S.gold-=refCost();rollShop();render()};
$('bRefAd').onclick=()=>showRewardedAd(()=>{rollShop();render()});
$('bGo').onclick=()=>{if(S.hand)return toast('手里还有物品,先放下或卖掉');if(!S.items.length)return toast('背包是空的');startBattle()};

// ---------- 自动战斗 ----------
let B;
function startBattle(){
  const en=ENEMIES[S.round-1],m=maxHp();S.phase='battle';
  B={t:0,php:m,pmax:m,pblk:12*rel('guard'),ppoi:0,ehp:en.hp,emax:en.hp,eblk:0,epoi:0,ecd:en.cd,sec:1,en,last:performance.now(),logs:[],
     units:S.items.filter(it=>ITEMS[it.id].cd).map(it=>{const s=statOf(it);return {it,type:ITEMS[it.id].t,v:s.v,cd:s.cd,left:s.cd}})};
  render();requestAnimationFrame(tick);
}
function log(t){B.logs.push(t);if(B.logs.length>2)B.logs.shift();$('log').innerHTML=B.logs.join('<br>')}
function hitEnemy(d){const a=Math.min(B.eblk,d);B.eblk-=a;B.ehp-=d-a}
function step(dt){
  B.t+=dt;
  for(const u of B.units){u.left-=dt;if(u.left>0)continue;u.left+=u.cd;const n=ITEMS[u.it.id].n;
    if(u.type==='weapon'){let d=u.v;if(Math.random()<0.15*rel('crit')){d*=2;log(`${n} 暴击 ${Math.round(d)}!`)}hitEnemy(d);
      if(rel('leech'))B.php=Math.min(B.pmax,B.php+d*0.1*rel('leech'))}
    else if(u.type==='shield')B.pblk+=u.v;
    else if(u.type==='heal')B.php=Math.min(B.pmax,B.php+u.v);
    else if(u.type==='poison')B.epoi+=u.v;}
  B.ecd-=dt;
  if(B.ecd<=0){B.ecd+=B.en.cd;let d=B.en.atk*(B.t>25?1+(B.t-25)*0.1:1);const a=Math.min(B.pblk,d);B.pblk-=a;B.php-=d-a;
    if(B.en.armor)B.eblk+=B.en.armor;if(B.en.poison)B.ppoi+=B.en.poison;
    log(`${B.en.n} 攻击 ${Math.round(d)}${B.t>25?'(狂暴)':''}`)}
  B.sec-=dt;
  if(B.sec<=0){B.sec+=1;B.ehp-=B.epoi;B.php-=B.ppoi;B.php=Math.min(B.pmax,B.php+rel('regen'));
    if(B.en.regen&&B.ehp>0)B.ehp=Math.min(B.emax,B.ehp+B.en.regen)}
}
function tick(now){
  if(S.phase!=='battle')return;
  let dt=Math.min(0.1,(now-B.last)/1000)*2.5;B.last=now;        // 2.5 倍速
  while(dt>0&&B.php>0&&B.ehp>0){const s=Math.min(0.05,dt);step(s);dt-=s}
  setBar('e',B.ehp,B.emax,B.eblk);setBar('p',B.php,B.pmax,B.pblk);
  $('eInfo').textContent=`${B.t.toFixed(1)}s`+(B.epoi?` · 中毒 ${B.epoi}`:'');
  for(const u of B.units){const e=$('it'+u.it.uid);if(e)e.firstChild.style.height=(100-u.left/u.cd*100)+'%'}
  if(B.ehp<=0)return endBattle(true);if(B.php<=0)return endBattle(false);
  requestAnimationFrame(tick);
}
function endBattle(win){
  S.phase='result';
  if(win){const g=7+S.round+3*rel('rich');
    if(S.round>=MAXR)return openBox(`<h3>🏆 通关!</h3><p>你击败了魔王。</p><button class="pri" onclick="closeBox();newGame()">再来一局</button>`);
    openBox(`<h3>胜利!</h3><p>获得 🪙${g}</p><div class="row" style="justify-content:center"><button class="pri" id="rOk">领取</button><button class="ad" id="rAd">▶ 看广告翻倍</button></div>`);
    $('rOk').onclick=()=>afterWin(g);$('rAd').onclick=()=>showRewardedAd(()=>afterWin(g*2));
  }else{S.hearts--;
    if(S.hearts<=0){openBox(`<h3>💀 冒险结束</h3><p>止步第 ${S.round} 关</p><div class="row" style="justify-content:center">${S.revived?'':'<button class="ad" id="rRev">▶ 看广告复活</button>'}<button id="rNew">重新开始</button></div>`);
      if(!S.revived)$('rRev').onclick=()=>showRewardedAd(()=>{S.revived=true;S.hearts=1;S.gold+=5;backToShop()});
      $('rNew').onclick=()=>{closeBox();newGame()};
    }else{openBox(`<h3>失败</h3><p>失去一颗心,获得安慰金 🪙5,重新挑战本关。</p><button class="pri" id="rOk">继续</button>`);
      $('rOk').onclick=()=>{S.gold+=5;backToShop()}}}
}
function afterWin(g){S.gold+=g;const r=S.round;S.round++;if(r%2===0&&r<=8)pickRelic();else backToShop()}
function pickRelic(){
  const pool=[...RELICS].sort(()=>Math.random()-0.5).slice(0,3);
  openBox(`<h3>选择一件遗物</h3>${pool.map((r,i)=>`<button class="relic" data-i="${i}"><b>${r.n}</b><br><span class="dim">${r.d}</span></button>`).join('')}<button class="ad" id="rRe">▶ 看广告换一批</button>`);
  $('box').querySelectorAll('.relic').forEach(b=>b.onclick=()=>{const r=pool[b.dataset.i];S.relics[r.k]=rel(r.k)+1;
    if(r.k==='space'){let n=3;for(let y=0;y<ROWS&&n;y++)for(let x=0;x<COLS&&n;x++)if(canUnlock(x,y)){S.unlocked.add(x+','+y);n--}}
    backToShop()});
  $('rRe').onclick=()=>showRewardedAd(pickRelic);
}
function backToShop(){closeBox();S.phase='shop';rollShop();render()}
addEventListener('resize',()=>S&&render());
newGame();
</script>
</body>
